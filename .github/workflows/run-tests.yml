name: run-tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.2]
        laravel: [^12.0, ^11.0]
        # composer.json requires filament/filament ^4.0 || ^5.0, so ^3.0 was
        # testing a version this package declares it does not support. It
        # fatals on Filament\Schemas\Schema, which only exists from v4. The
        # swallowed exit code is the only reason that looked green.
        filament: ['^4.0', '^5.0']
        include:
          - laravel: ^12.0
            testbench: 10.*
          # Laravel 11 is past security support and every 11.x release now
          # carries a Composer advisory, so these legs alone may install
          # advisory-flagged versions (as escalated-laravel's EOL legs do).
          - laravel: ^11.0
            testbench: 9.*
            allow-insecure: true

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          # Only the EOL legs above opt out of Composer's advisory install
          # block; every other leg still refuses insecure versions.
          if [ "${{ matrix.allow-insecure }}" = "true" ]; then
            composer config audit.block-insecure false
          fi
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      # No `|| echo` fallback. It swallowed pest's exit code, so a red suite
      # reported green -- a 124-test regression from a Livewire bump merged
      # that way. If a matrix leg genuinely has no tests, pest's own
      # --no-tests-are-not-a-failure would be the narrow fix; silencing every
      # failure is not.
      - name: Execute tests
        run: vendor/bin/pest
